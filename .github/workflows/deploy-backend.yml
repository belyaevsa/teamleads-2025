name: Deploy backend → teamleads.kz/api

# Continuous deploy: a push to master touching backend/** swaps the container on the
# host. The container applies EF migrations on startup, so a merged migration reaches
# the production schema without a separate step – review migrations with that in mind.
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:   # manual re-run (Actions tab → Run workflow)

# Don't let two backend deploys race on the same container/env file.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted          # runner is ON the host → build + docker run locally, no registry/SSH
    env:
      IMAGE: teamleads-backend
      CONTAINER: teamleads-backend
      HOST_BIND: 127.0.0.1:5080
      ENV_DIR: /opt/teamleads-backend

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${SHORT_SHA}" -t "${IMAGE}:latest" backend

      - name: Write env file from secrets
        env:
          CONN: ${{ secrets.BACKEND_CONNECTION_STRING }}
          ADMIN_KEY: ${{ secrets.BACKEND_ADMIN_API_KEY }}
          IP_SALT: ${{ secrets.BACKEND_IP_HASH_SALT }}
          TG_TOKEN: ${{ secrets.BACKEND_TG_BOT_TOKEN }}
          TG_SECRET: ${{ secrets.BACKEND_TG_WEBHOOK_SECRET }}
        run: |
          install -d -m 700 "$ENV_DIR"
          umask 077
          {
            printf 'ASPNETCORE_ENVIRONMENT=Production\n'
            printf 'ConnectionStrings__Default=%s\n' "$CONN"
            printf 'ADMIN_API_KEY=%s\n' "$ADMIN_KEY"
            printf 'IP_HASH_SALT=%s\n' "$IP_SALT"
            printf 'TG_BOT_TOKEN=%s\n' "$TG_TOKEN"
            printf 'TG_WEBHOOK_SECRET=%s\n' "$TG_SECRET"
            # Chat ids live in the Settings table (seeded by migration, edited via /set).
            # Archive feed: read the landing deploy dir on this host, no network hop.
            printf 'BOT_DATA_PATH=/opt/teamleads.kz/latest/bot-data.json\n'
            printf 'BOT_DATA_URL=https://teamleads.kz/bot-data.json\n'
            # Scheduler switch and dilemma slot are NOT written here: they live in the
            # Settings table (seeded on startup, edited via /set). A deploy must not be
            # able to silently revert what someone changed from the admin chat.
          } > "$ENV_DIR/backend.env"

      - name: Swap container
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" \
            --restart unless-stopped \
            -p "${HOST_BIND}:8080" \
            --env-file "$ENV_DIR/backend.env" \
            "${IMAGE}:${SHORT_SHA}"

      - name: Health gate
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${HOST_BIND}/api/health" >/dev/null; then
              echo "Backend healthy."; exit 0
            fi
            sleep 2
          done
          echo "Health check failed; recent logs:" >&2
          docker logs --tail 80 "$CONTAINER" >&2 || true
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f >/dev/null
