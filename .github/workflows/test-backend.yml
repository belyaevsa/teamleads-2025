name: Test backend

# Tests only, never a deploy. Fires on every branch except master, so work in progress
# gets a verdict before it turns into a pull request – and long before a merge to master
# swaps the production container (that path lives in deploy-backend.yml).
#
# No `pull_request` trigger on purpose. A PR branch in this repo is already covered by
# the push trigger below, and adding both would run the same commit twice. It also keeps
# fork code off the self-hosted runner, which sits on the production host.
on:
  push:
    branches-ignore: [master]
    # Code only. Insights pages, scenarios and landing content change most days and have
    # nothing to do with this suite; running it for them trains everyone to ignore the
    # red X. Note landing-main has its own checks – they are not wired up here.
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - '.github/workflows/test-backend.yml'

  workflow_dispatch:   # manual run (Actions tab → Run workflow)

# One run per branch. A rapid series of pushes only needs a verdict on the last one.
concurrency:
  group: test-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # In the SDK container rather than on the host: the deploy path only ever needed
      # Docker, so the runner is not guaranteed to have a .NET SDK, and pinning to the
      # same image the Dockerfile builds with keeps CI and the shipped artifact on one
      # toolchain. --user avoids leaving root-owned bin/obj in the runner workspace.
      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e NUGET_PACKAGES=/src/.nuget \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test backend.Tests/TeamleadsBackend.Tests.csproj --nologo -v minimal
