# ── Salary API micro-cache zone (merged from nginx-salary-proxy.conf).
#    Must live at http context – this file is included from /etc/nginx/conf.d/
#    (inside http{}), so top-of-file is correct. Pairs with `location /api/salaries/`
#    below: once a good 200 is cached, upstream 502s serve the last-known data.
proxy_cache_path /var/cache/nginx/salary
    levels=1:2
    keys_zone=salary_cache:10m
    max_size=64m
    inactive=24h
    use_temp_path=off;

server {
       server_name teamleads.kz;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        access_log /var/log/nginx/teamleads.kz.access;
        error_log /var/log/nginx/teamleads.kz.error error;

        root /opt/teamleads.kz/latest;   # ← CHANGE 1: moved root to server level

        index index.html;
        add_header Content-Security-Policy "default-src 'self';
           script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.yandex.ru https://*.yandex.com https://www.googletagmanager.com https://www.google-analytics.com;
           style-src 'self' 'unsafe-inline';
           img-src 'self' data: https://*.yandex.ru https://*.yandex.com https://www.google-analytics.com https://www.googletagmanager.com;
           connect-src 'self' https://api.techinterview.space https://*.yandex.ru https://*.yandex.com wss://*.yandex.com https://*.google-analytics.com https://analytics.google.com https://*.googletagmanager.com;
           frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://vk.com https://rutube.ru;
           media-src 'self' https://storage.yandexcloud.net;
           font-src 'self';" always;

        # ── Static-asset cache default (merged from nginx-cache.conf).
        #    Mutable content (HTML, /, per-page index.md, shell-index.json, RSS,
        #    sitemap) always revalidates – nginx answers an unchanged request with a
        #    cheap 304, never a full re-download. Kept at SERVER level (not in a
        #    location) so HTML documents keep BOTH this and the CSP above: an
        #    add_header inside a location does NOT inherit server-level add_headers,
        #    so a per-location Cache-Control would silently drop the CSP on documents.
        #    The asset location blocks below intentionally override this – CSS/JS/
        #    fonts/images don't need CSP and set their own long-lived Cache-Control.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;


        # ── Charset for the machine-readable text endpoints (llms.txt,
        #    llms-full.txt, per-page index.md, RSS). HTML carries its own
        #    <meta charset>, but text/plain without `; charset=utf-8` makes
        #    browsers guess a single-byte encoding and the Cyrillic renders as
        #    mojibake. nginx appends the charset only to charset_types, and
        #    text/markdown is not in the default list, so it is spelled out here.
        charset utf-8;
        charset_types
          text/plain
          text/markdown
          text/css
          text/xml
          application/javascript
          application/rss+xml
          application/json;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types
          text/plain
          text/markdown
          text/css
          text/xml
          text/javascript
          application/javascript
          application/xml+rss
          application/json;


      location / {
          try_files $uri $uri/ =404;   # ← CHANGE 2 (the fix): was  $uri $uri/ /index.html;
      }

      # ── Immutable: content-hashed assets (merged from nginx-cache.conf).
      #    Hugo emits main.<sha256>.css – the hash is the cache key, so the URL
      #    changes whenever the bytes do. Cache forever, never revalidate.
      location ~* "\.[0-9a-f]{32,}\.(css|js)$" {
          add_header Cache-Control "public, max-age=31536000, immutable" always;
      }

      # ── Long-lived: stable-name binary assets (fonts, images, icons, OG cards).
      #    Bytes rarely change; a 30-day window skips the round-trip, and the ETag
      #    still yields a 304 (not a re-download) once it lapses.
      location ~* "\.(woff2?|ttf|eot|otf|png|jpe?g|webp|gif|svg|ico)$" {
          add_header Cache-Control "public, max-age=2592000" always;
      }

      # ── Per-page markdown (Hugo's `cat` output format: /<section>/<page>/index.md).
      #    nginx ships no .md entry in mime.types, so these fall through to
      #    default_type application/octet-stream and the browser downloads the file
      #    instead of showing it. text/markdown + the charset above renders inline.
      #    No add_header here on purpose: a location that declares one drops every
      #    server-level add_header (CSP, Cache-Control) instead of inheriting them.
      location ~* "\.md$" {
          default_type text/markdown;
      }

      # ── Salary API reverse-proxy + stale-cache (merged from nginx-salary-proxy.conf).
      #    Same-origin (no CORS, ever) and serves the last-good response through
      #    upstream 5xx/outages. Pairs with the proxy_cache_path zone atop this file.
      #    After first activation, prime it once:
      #      curl -sD- -o/dev/null 'https://teamleads.kz/api/salaries/chart?allowReadonly=true'
      #    and set salaryApi="/api/salaries/chart?allowReadonly=true" in hugo.toml.
      location /api/salaries/ {
          proxy_pass https://api.techinterview.space/api/salaries/;
          proxy_http_version 1.1;
          proxy_set_header Host api.techinterview.space;
          proxy_ssl_server_name on;             # SNI for the upstream TLS handshake
          proxy_set_header Connection "";
          proxy_set_header Origin "";            # sidestep upstream CORS quirks

          proxy_cache salary_cache;
          proxy_cache_valid 200 6h;             # fresh window for a cached 200
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          proxy_cache_background_update on;      # serve cached copy, refresh behind it
          proxy_cache_lock on;                   # collapse concurrent misses into one upstream call
          proxy_connect_timeout 5s;
          proxy_read_timeout 10s;

          add_header Cache-Control "public, max-age=600";
          add_header X-Cache-Status $upstream_cache_status always;
      }

      # ── Paste pages – dynamically served by the .NET backend.
      #    /p/A7F3K2/  →  backend returns an HTML page with syntax highlighting.
      #    This block must come before the /api/ block so the
      #    bare /p/ prefix doesn't shadow /paste/ (the Hugo creation page).
      location ~ ^/p/[A-Za-z0-9]+/?$ {
          proxy_pass http://127.0.0.1:5080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 5s;
          proxy_read_timeout 10s;
          add_header Cache-Control "public, max-age=3600" always;
      }

      # ── First-party .NET backend (Docker container on the host, 127.0.0.1:5080).
      #    `/api/salaries/` above is a more-specific prefix and still wins; this
      #    catches the rest of /api/* (health, feedback, submissions, …). The asset
      #    regex blocks don't match /api/* (no file extension), so they don't hijack it.
      #    proxy_pass has no URI part, so the /api/ prefix is forwarded unchanged and
      #    the backend's own /api routes line up.
      location /api/ {
          proxy_pass http://127.0.0.1:5080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # backend reads the real client IP from this
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 5s;
          proxy_read_timeout 30s;
          add_header Cache-Control "no-store" always;   # API JSON must never hit the static cache rules
      }

      error_page 404 /404.html;
      location = /404.html {           # ← CHANGE 3: was  location = /40x.html {}
          internal;
      }

      error_page 500 502 503 504 /50x.html;
      location = /50x.html {
          internal;
      }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/teamleads.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/teamleads.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = teamleads.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen       80;
        listen       [::]:80;
        server_name  teamleads.kz;
    return 404; # managed by Certbot
}

server {
    if ($host = teamleads.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


       server_name 2025.teamleads.kz;
    listen 80;
    return 404; # managed by Certbot


}
