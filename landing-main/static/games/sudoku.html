<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Судоку – Тимлид не кодит</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --line2:#484f58;
    --txt:#c9d1d9; --dim:#6e7681; --accent:#FEC50C; --cy:#39c5cf;
    --ok:#3fb950; --err:#f85149; --fixed:#e6edf3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 26px; gap:14px; min-height:100%;
  }
  .head{width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between; gap:10px}
  .title{color:var(--cy); font-size:15px; letter-spacing:.02em}
  .title b{color:var(--accent)}
  .bar{display:flex; gap:10px; align-items:center; font-size:13px; color:var(--dim)}
  .bar .stat b{color:var(--txt); font-weight:600}
  .diff{display:flex; gap:6px}
  .diff button{
    background:#21262d; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; font:inherit; font-size:12px; cursor:pointer;
  }
  .diff button.is-on{border-color:var(--accent); color:var(--accent)}
  .board{
    --c:min(46px, calc((100vw - 40px) / 9));
    width:calc(var(--c) * 9); display:grid;
    grid-template-columns:repeat(9, var(--c)); grid-template-rows:repeat(9, var(--c));
    background:var(--line2); border:2px solid var(--line2); border-radius:8px; overflow:hidden;
    touch-action:manipulation; user-select:none;
  }
  .cell{
    background:var(--bg); display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--c) * .5); cursor:pointer; position:relative; color:var(--cy);
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .cell.fixed{color:var(--fixed); cursor:default}
  .cell.r3{border-bottom:2px solid var(--line2)}
  .cell.c3{border-right:2px solid var(--line2)}
  .cell.peer{background:#11202b}
  .cell.same{background:#15303a}
  .cell.sel{background:#243b1f; box-shadow:inset 0 0 0 2px var(--accent)}
  .cell.bad{color:var(--err)!important}
  .cell.hint{color:var(--accent)}
  .pad{width:calc(min(46px,(100vw - 40px)/9) * 9); display:grid; grid-template-columns:repeat(9,1fr); gap:6px}
  .pad button{
    background:#21262d; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:12px 0; font:inherit; font-size:18px; cursor:pointer;
  }
  .pad button:active{background:#30363d}
  .pad button.done{color:var(--dim); opacity:.5}
  .actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .actions button{
    background:#21262d; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:9px 14px; font:inherit; font-size:13px; cursor:pointer;
  }
  .actions button.primary{border-color:var(--accent); color:var(--accent)}
  .actions button.ghost{color:var(--dim)}
  .msg{min-height:20px; font-size:14px; text-align:center}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.dim{color:var(--dim)}
  .foot{font-size:12px; color:var(--dim); text-align:center}
  .foot a{color:var(--cy); text-decoration:none; border-bottom:1px dotted var(--cy)}
  .erase{font-size:13px!important}
</style>
</head>
<body>
  <div class="head">
    <span class="title"><b>судоку</b> · тимлид не кодит</span>
    <span class="bar">
      <span class="stat">⏱ <b id="timer">0:00</b></span>
      <span class="stat">ошиб. <b id="mistakes">0</b></span>
    </span>
  </div>

  <div class="diff" id="diff">
    <button data-d="easy" class="is-on">Лёгкий</button>
    <button data-d="medium">Средний</button>
    <button data-d="hard">Сложный</button>
  </div>

  <div class="board" id="board" aria-label="Поле судоку"></div>

  <div class="pad" id="pad"></div>

  <div class="actions">
    <button class="primary" id="new">Новая игра</button>
    <button id="check">Проверить</button>
    <button id="hint">Подсказка</button>
    <button class="ghost" id="solve">Решить</button>
  </div>

  <div class="msg dim" id="msg">Кликните клетку и введите цифру (1–9). Тимлид не кодит – тимлид решает судоку.</div>
  <div class="foot">Закрыть окно – вернуться в терминал. <a href="https://teamleads.kz/" target="_blank" rel="noopener">teamleads.kz</a></div>

<script>
(function () {
  'use strict';
  var board = document.getElementById('board');
  var pad = document.getElementById('pad');
  var msg = document.getElementById('msg');
  var timerEl = document.getElementById('timer');
  var mistakesEl = document.getElementById('mistakes');
  var CLUES = { easy: 40, medium: 32, hard: 26 };
  var diff = 'easy';
  var solution = [], puzzle = [], cur = [], fixed = [], cells = [];
  var sel = -1, mistakes = 0, started = 0, timer = null, won = false;

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // Generate a full valid solution from a base pattern, then permute it.
  function generateSolution() {
    var rows = [], cols = [], nums = shuffle([1,2,3,4,5,6,7,8,9]);
    var bands = shuffle([0,1,2]);
    bands.forEach(function (b) { shuffle([0,1,2]).forEach(function (r) { rows.push(b * 3 + r); }); });
    var stacks = shuffle([0,1,2]);
    stacks.forEach(function (s) { shuffle([0,1,2]).forEach(function (c) { cols.push(s * 3 + c); }); });
    function p(r, c) { return (3 * (r % 3) + Math.floor(r / 3) + c) % 9; }
    var g = [];
    for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) g[r * 9 + c] = nums[p(rows[r], cols[c])];
    return g;
  }

  function newGame() {
    won = false; mistakes = 0; mistakesEl.textContent = '0';
    solution = generateSolution();
    fixed = []; cur = []; puzzle = solution.slice();
    var idx = shuffle(Array.from({ length: 81 }, function (_, i) { return i; }));
    var remove = 81 - CLUES[diff];
    for (var k = 0; k < remove; k++) puzzle[idx[k]] = 0;
    for (var i = 0; i < 81; i++) { fixed[i] = puzzle[i] !== 0; cur[i] = puzzle[i]; }
    sel = -1;
    render(); setMsg('Поехали. Клетка + цифра. Стрелки двигают курсор.', 'dim');
    started = Date.now(); clearInterval(timer); timer = setInterval(tick, 1000); tick();
  }

  function tick() {
    var s = Math.floor((Date.now() - started) / 1000);
    timerEl.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function setMsg(t, cls) { msg.textContent = t; msg.className = 'msg ' + (cls || 'dim'); }

  function conflict(i, v) {
    if (!v) return false;
    var r = Math.floor(i / 9), c = i % 9;
    for (var k = 0; k < 9; k++) {
      if (k !== c && cur[r * 9 + k] === v) return true;
      if (k !== r && cur[k * 9 + c] === v) return true;
    }
    var br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
    for (var rr = br; rr < br + 3; rr++) for (var cc = bc; cc < bc + 3; cc++) {
      var j = rr * 9 + cc; if (j !== i && cur[j] === v) return true;
    }
    return false;
  }

  function render() {
    board.innerHTML = ''; cells = [];
    for (var i = 0; i < 81; i++) {
      var r = Math.floor(i / 9), c = i % 9;
      var d = document.createElement('div');
      d.className = 'cell' + (fixed[i] ? ' fixed' : '') + ((r % 3 === 2 && r !== 8) ? ' r3' : '') + ((c % 3 === 2 && c !== 8) ? ' c3' : '');
      d.textContent = cur[i] ? cur[i] : '';
      (function (idx) { d.addEventListener('click', function () { select(idx); }); })(i);
      board.appendChild(d); cells.push(d);
    }
    paint(); buildPad();
  }

  function paint() {
    var selR = sel >= 0 ? Math.floor(sel / 9) : -1, selC = sel >= 0 ? sel % 9 : -1;
    var selV = sel >= 0 ? cur[sel] : 0;
    for (var i = 0; i < 81; i++) {
      var d = cells[i], r = Math.floor(i / 9), c = i % 9;
      d.className = d.className.replace(/ (peer|same|sel|bad)/g, '');
      if (sel >= 0) {
        var sameBox = Math.floor(r / 3) === Math.floor(selR / 3) && Math.floor(c / 3) === Math.floor(selC / 3);
        if (r === selR || c === selC || sameBox) d.className += ' peer';
        if (selV && cur[i] === selV) d.className += ' same';
        if (i === sel) d.className += ' sel';
      }
      if (!fixed[i] && cur[i] && conflict(i, cur[i])) d.className += ' bad';
      d.textContent = cur[i] ? cur[i] : '';
    }
  }

  function buildPad() {
    pad.innerHTML = '';
    for (var n = 1; n <= 9; n++) {
      var b = document.createElement('button');
      var count = cur.filter(function (v) { return v === n; }).length;
      b.textContent = n; if (count >= 9) b.className = 'done';
      (function (num) { b.addEventListener('click', function () { place(num); }); })(n);
      pad.appendChild(b);
    }
    var e = document.createElement('button'); e.className = 'erase'; e.textContent = '⌫';
    e.addEventListener('click', function () { place(0); }); pad.appendChild(e);
  }

  function select(i) { sel = i; paint(); }

  function place(v) {
    if (sel < 0) { setMsg('Сначала выберите клетку.', 'dim'); return; }
    if (fixed[sel]) { setMsg('Это подсказка – её не изменить.', 'dim'); return; }
    if (won) return;
    var prev = cur[sel];
    cur[sel] = v;
    if (v && v !== solution[sel] && prev !== v) { mistakes++; mistakesEl.textContent = mistakes; }
    paint(); buildPad();
    checkWin();
  }

  function checkWin() {
    for (var i = 0; i < 81; i++) if (cur[i] !== solution[i]) return false;
    won = true; clearInterval(timer);
    setMsg('🎉 Решено за ' + timerEl.textContent + ', ошибок: ' + mistakes + '. Чисто!', 'ok');
    return true;
  }

  function move(dr, dc) {
    if (sel < 0) { select(0); return; }
    var r = Math.floor(sel / 9), c = sel % 9;
    r = (r + dr + 9) % 9; c = (c + dc + 9) % 9; select(r * 9 + c);
  }

  document.getElementById('new').addEventListener('click', newGame);
  document.getElementById('solve').addEventListener('click', function () {
    cur = solution.slice(); won = true; clearInterval(timer); paint(); buildPad();
    setMsg('Решение показано. Новая игра – свежий расклад.', 'dim');
  });
  document.getElementById('check').addEventListener('click', function () {
    var wrong = 0, empty = 0;
    for (var i = 0; i < 81; i++) { if (!cur[i]) empty++; else if (cur[i] !== solution[i]) wrong++; }
    if (won) return;
    if (!empty && !wrong) checkWin();
    else if (wrong) setMsg('Ошибок на поле: ' + wrong + (empty ? ', пустых: ' + empty : '') + '.', 'err');
    else setMsg('Пока всё верно. Осталось клеток: ' + empty + '.', 'ok');
  });
  document.getElementById('hint').addEventListener('click', function () {
    var open = [];
    for (var i = 0; i < 81; i++) if (cur[i] !== solution[i]) open.push(i);
    if (!open.length) return;
    var pick = sel >= 0 && cur[sel] !== solution[sel] ? sel : open[Math.floor(Math.random() * open.length)];
    cur[pick] = solution[pick]; fixed[pick] = true; sel = pick;
    render(); cells[pick].className += ' hint';
    setMsg('Подсказка поставлена.', 'dim'); checkWin();
  });
  document.getElementById('diff').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    diff = b.getAttribute('d') || b.getAttribute('data-d');
    Array.prototype.forEach.call(this.children, function (x) { x.className = ''; });
    b.className = 'is-on'; newGame();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '9') { place(parseInt(e.key, 10)); e.preventDefault(); }
    else if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') { place(0); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { move(-1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { move(1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { move(0, -1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { move(0, 1); e.preventDefault(); }
  });

  newGame();
})();
</script>
</body>
</html>
