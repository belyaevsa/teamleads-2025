# Тимлид-симулятор – данные для команды `sim` в shell-режиме.
# Развилки из реальных споров сообщества. Каждый сценарий:
#   prompt   – ситуация (можно несколько строк),
#   options  – варианты [label, good, outcome]; good=true даёт +1 к счёту,
#              как отвечали на самом деле – считает бэкенд (/api/sim/stats), не автор,
#   lesson   – вывод, link – «section/slug» материала для разбора (резолвится в URL).
# Добавляйте сценарии свободно – порядок в прогоне перемешивается.

title: "Тимлид-симулятор"
intro: "Короткие развилки из реальных споров сообщества. Выбирай – смотри последствия."
shareUrl: "https://teamleads.kz/shell/#sim"

scenarios:
  - id: bus-factor
    prompt: |-
      Единственный, кто знает платёжный модуль, увольняется через две недели.
      Прод-диск зашифрован по требованию HIPAA – пароль только у него в голове.
    options:
      - label: "Посадить дублёра в пару и сразу перенести доступы в общее хранилище"
        good: true
        outcome: "Знание переезжает в живого человека, а пароль – из головы в хранилище. Так и выглядит страховка."
      - label: "Заказать подробную документацию по модулю"
        good: false
        outcome: "Док опишет «что», но не «почему». А пароль в документ не запишешь – он всё ещё в чужой голове."
      - label: "Заморозить вопрос: сейчас релиз, потом разберёмся"
        good: false
        outcome: "Две недели проходят. Экстремальная ситуация рождается из экономии – и стоит дороже всех релизов."
    lesson: "Продуктовое знание не живёт в документах, а доступы – не в головах. Живой дублёр плюс общее хранилище."
    link: "articles/bas-faktor-odin-nositel-znaniy"

  - id: junior-burn
    prompt: |-
      Джун впервые уронил прод – зона поражения ограничена, клиенты не в панике.
      Стоит рядом, руки трясутся, ждёт, что вы всё почините за него.
    options:
      - label: "Чинить самому – быстро, пока не разнесло"
        good: false
        outcome: "Прод спасён, джун – нет. В следующий раз снова прибежит к вам, а ответственность так и не приросла."
      - label: "Дать ему чинить под присмотром, потом безблам-разбор и план отката на будущее"
        good: true
        outcome: "Руль у него, вы рядом. Право на ошибку плюс дисциплина «как откатывать» – и ответственность растёт."
      - label: "Отстранить от прода – пусть пока не трогает"
        good: false
        outcome: "Снимаете риск и заодно рост. Джун останется джуном, а прод станет для него чужой территорией."
    lesson: "Ответственность не передаётся лекцией. Дайте обжечься под присмотром – и научите думать об откате заранее."
    link: "insights/week-2026-06-16"

  - id: imposed-decision
    prompt: |-
      Стейкхолдер требует выкатить фичу его любимым способом.
      Вы видите, что способ дороже и хрупче.
    options:
      - label: "Молча сделать как просят – он же заказчик"
        good: false
        outcome: "Доверие куплено ценой техдолга. Платить будет команда."
      - label: "Показать на цифрах два пути и дать выбрать ему"
        good: true
        outcome: "Решение остаётся за ним, но теперь информированное. Это и есть влияние."
      - label: "Сделать по-своему и поставить перед фактом"
        good: false
        outcome: "Иногда срабатывает. Чаще сжигает доверие, которое потом не вернуть."
    lesson: "Бороться с навязанным решением – это не саботаж и не подчинение, а аргументы и выбор."
    link: "articles/kak-borotsya-s-navyazannymi-resheniyami"

  - id: metrics-lie
    prompt: |-
      Дашборд зелёный: velocity растёт, тикетов закрыто больше.
      А пользователи жалуются громче прежнего.
    options:
      - label: "Верить дашборду – цифры не врут"
        good: false
        outcome: "Цифры не врут, но отвечают не на тот вопрос. Закрыто не значит полезно."
      - label: "Пойти к пользователям и посмотреть на реальный путь"
        good: true
        outcome: "Метрика – палец, указывающий на луну. Смотреть надо на луну."
      - label: "Добавить ещё метрик, чтобы стало понятнее"
        good: false
        outcome: "Больше приборов – не больше зрения. Иногда это шум поверх шума."
    lesson: "Метрики врут не потому что ложны, а потому что вы смотрите не туда."
    link: "articles/metriki-vruyt-ili-vy-nepravilno-smotrite"

  - id: naslabo
    prompt: |-
      Команда оценивает фичу в полгода. Вы подозреваете, что за оценкой –
      не сложность, а страх обещать.
    options:
      - label: "Принять оценку – команде виднее"
        good: false
        outcome: "Иногда виднее. Иногда полгода – это «не хочу обещать». Без проверки вы не отличите одно от другого."
      - label: "Запустить с командой короткий спайк-прототип и сверить оценку на результате"
        good: true
        outcome: "Три дня эксперимента снимают неопределённость лучше совещаний. Это не «я же говорил», а общая проверка."
      - label: "Продавить дедлайн сверху без проверки"
        good: false
        outcome: "Дедлайн назначен, доверие потрачено, а реальная сложность всё ещё никому не известна."
    lesson: "Дорогая оценка часто прячется за страх. Дешёвый совместный эксперимент проверяет её, не обесценивая команду."
    link: "articles/r-and-d-v-it-chto-schitat-issledovaniem"

  # --- added by /process-meetup from meetup-2026-06-24 ---
  - id: meetup-2026-06-24-when-to-hire
    prompt: |-
      Команда не вывозит, каждый тянет по две-три роли.
      Просите ещё одного человека – «и всё наладится».
    options:
      - label: "Нанять сразу – рук явно не хватает"
        good: false
        outcome: "Иногда помогает. Чаще растят бюрократию и теряют, кто за что отвечает."
      - label: "Понять, какая роль перегружена без компетенции, и нанять под неё"
        good: true
        outcome: "Узкое место снято точечно. Это найм против боли, а не ради оргструктуры."
      - label: "Добавить процессы и подождать – вдруг устаканится"
        good: false
        outcome: "Процесс поверх перегруза – это лак поверх трещины."
    lesson: "Нанимать стоит под конкретную перегруженную роль, а не чтобы «стало полегче» вообще."
    link: "events/meetup-2026-06-24"

  # --- карьера ---
  - id: career-fork
    prompt: |-
      Сеньор просит повышения до тимлида: «пора расти».
      Свободной тимлидской вакансии нет, а ждать можно годами.
    options:
      - label: "Создать должность под него – иначе уйдёт"
        good: false
        outcome: "Лычка есть, роли нет. Управленческая работа может оказаться ему адом, а место уже занято."
      - label: "Разобрать развилку: техветка или менеджмент – и расти по содержанию, а не по лычке"
        good: true
        outcome: "Тимлид – не «сеньор плюс подчинённые». Иногда рост – остаться сильным инженером или сменить компанию."
      - label: "Посоветовать дождаться вакансии – или подсидеть действующего"
        good: false
        outcome: "Ждать можно дольше, чем вырасти. А игра в подсиживание сжжёт вас в той же компании."
    lesson: "Тимлидов структурно меньше, чем сеньоров. Рост измеряют не должностью, а тем, что вы можете в чужом проекте."
    link: "articles/karernyy-trek-razrabotchika-posle-senora"

  # --- процессы / соблюдение ритуалов ---
  - id: ritual-diagnosis
    prompt: |-
      Инженер систематически не ведёт важный процесс (логи, статус, ревью).
      1-1 провели – ноль. Уволить нельзя.
    options:
      - label: "Давить публично: пусть команда на дейлике спросит у него"
        good: false
        outcome: "Давление работает, когда не хочет. Если забывает или не видит ценности – будет стресс без результата."
      - label: "Сначала диагноз – не хочет, забывает, не может встроить, не видит ценности – потом инструмент"
        good: true
        outcome: "Забыл → триггер. Не видит ценности → два кейса с последствиями. Лекарство под причину, а не под настроение."
      - label: "Переложить процесс на самого ответственного – кто пашет, на том и едут"
        good: false
        outcome: "Снимаете проблему один раз. На второй ответственный задумается, зачем вообще стараться."
    lesson: "Один инструмент на все причины создаёт стресс без результата. Сначала диагноз, потом лекарство."
    link: "articles/sotrudnik-ne-soblyudaet-ritual-chto-delat"

  # --- AI: архитектура ---
  - id: ai-scout
    prompt: |-
      Бизнес хочет встроить LLM в поддержку навсегда:
      «пусть сама отвечает клиентам, как все».
    options:
      - label: "Встроить в прод навсегда – так сейчас все делают"
        good: false
        outcome: "Стохастический компонент на критичном пути. Галлюцинации, привязка к чужому API и ценам – теперь навсегда."
      - label: "Использовать LLM как разведчика: собрать паттерны и формализовать их в обычный код"
        good: true
        outcome: "Модель разведала реальное поведение – и ушла. На её месте скучный предсказуемый код, который не галлюцинирует."
      - label: "Не трогать вовсе – слишком рискованно"
        good: false
        outcome: "Вы спаслись от риска и заодно упустили discovery: половина правил всё ещё живёт только в головах."
    lesson: "Самый зрелый способ внедрить ИИ – иногда внедрить его временно. Разведать – и уйти, оставив детерминированный код."
    link: "articles/llm-kak-razvedchik"

  # --- AI: состав команды ---
  - id: ai-team-shape
    prompt: |-
      Кодинг подешевел: AI пишет бойлерплейт за копейки.
      Формируете команду на новый продукт.
    options:
      - label: "Набрать 10 джунов на бойлерплейт – рук много, дёшево"
        good: false
        outcome: "Именно эту работу через год будет делать один человек с AI. Команда, заточенная под то, что обесценилось."
      - label: "Взять пару сильных инженеров, что держат систему целиком и работают с AI"
        good: true
        outcome: "Понимание бизнеса, архитектура и ответственность за прод. Ценные в обоих сценариях будущего."
      - label: "Заменить разработчиков автономными агентами – один человек на 117"
        good: false
        outcome: "Код генерируется. Кто несёт ответственность за прод и держит контекст параллельных миграций – непонятно."
    lesson: "Не ставьте на один сценарий. Сильна команда, ценная при любом будущем – кто понимает бизнес и отвечает за результат."
    link: "articles/zamenit-li-ai-razrabotchikov"

  # --- продуктовые разработчики ---
  - id: product-engineer
    prompt: |-
      Нужен «продуктовый разработчик» – чтобы понимал бизнес,
      а не только код. Где его взять?
    options:
      - label: "Учить программированию и бизнесу одновременно с нуля"
        good: false
        outcome: "Педагогически неверно и дорого. За большим хайпом часто скрывается большой попил."
      - label: "Сначала вырастить инженера, потом доучивать до продуктового через гембу и доменных экспертов"
        good: true
        outcome: "Разработчик есть – теперь ему показывают реальную работу бизнеса на месте, а не на слайдах."
      - label: "Нанять по грейду и надеяться, что сам разберётся"
        good: false
        outcome: "Грейд не гарантирует понимания предметки. Через год получите крепкого кодера, глухого к бизнесу."
    lesson: "Сначала инженер, потом – продуктовый. Гемба и доменные эксперты вместо хайпа."
    link: "events/meetup-2026-06-24"

  # --- наём: рейтинг прошлого работодателя ---
  - id: week-2026-06-23-employer-rating
    prompt: |-
      Сильный кандидат, но его прошлый работодатель – в самом низу рейтинга компаний.
      Рекрутинг дорогой, ошибка найма дороже. Брать в шорт-лист?
    options:
      - label: "Отклонить – раз компания внизу рейтинга, там и научили работать «через одно место»"
        good: false
        outcome: "Так же кто-то отклонит вас за вашу нынешнюю компанию. Дискриминация по логотипу выкидывает сильных, кто как раз решил расти дальше."
      - label: "Оценить, как он работал, а не где: созвон с командой, реальная задача, вопрос про практики, с которыми он был не согласен"
        good: true
        outcome: "Бренд работодателя имеет нулевую корреляцию с качеством. А как человек работает, видно на задаче и по тому, что он менял там, где было плохо."
      - label: "Взять без проверки – кандидатов мало, а ТК всё равно на стороне работника"
        good: false
        outcome: "Дефицит – не повод пропускать проверку. Цена ошибки найма выше стоимости одного собеседования с командой."
    lesson: "Судите по тому, как человек работал, а не где. Рейтинг прошлого работодателя – суррогат с нулевой корреляцией."
    link: "insights/week-2026-06-23"

  # --- клиентская гонка vs здоровье продукта ---
  - id: meetup-2026-07-01-client-treadmill
    prompt: |-
      Молодой стартап: каждую неделю крупный клиент требует «ещё одну интеграцию» к сроку,
      а производство уже захлёбывается. Продажи давят: сделку нельзя терять.
    options:
      - label: "Бросить всё и сделать интеграцию – клиента терять нельзя"
        good: false
        outcome: "Продажи и дальше задают темп разработке. Вы субсидируете интеграции из своего кармана и живёте в «беличьем колесе»."
      - label: "Согласовать срок и цену интеграции, защитив производственную ёмкость"
        good: true
        outcome: "Клиент почти всегда может подождать пару недель, а платная доработка отделяет реальные потребности от «хотелок»."
      - label: "Нанять ещё разработчиков, чтобы успевать за продажами"
        good: false
        outcome: "Найм не лечит несбалансированную экономику: вы раздуваете производство под низкомаржинальные продажи."
    lesson: "Не давайте продажам задавать темп разработке: цена, приоритизация 20/80 и продажа «на равных» вместо гонки за каждой хотелкой."
    link: "events/meetup-2026-07-01"

  # --- влияние на менее компетентного руководителя ---
  - id: meetup-2026-07-01-grey-cardinal
    prompt: |-
      Ваш прямой руководитель слабее вас в софт-скиллах и часто ошибается.
      Как проводить нужные вам решения?
    options:
      - label: "Стать «серым кардиналом» – мягко манипулировать и продавливать своё через него"
        good: false
        outcome: "Рабочая тактика ценой политических клик. Скоро вы сами будете параноить, что подсиживают уже вас."
      - label: "Влиять прямо и прозрачно, а системную проблему поднимать через организацию"
        good: true
        outcome: "Дороже в моменте, но не плодит интриги. Если руководитель вменяемый – договоритесь без манипуляций."
      - label: "Терпеть и подстраиваться под настроение – не связываться"
        good: false
        outcome: "Проблема никуда не девается, а вы молча выгораете, оставляя решение на волю случая."
    lesson: "Прямое прозрачное влияние побеждает «тёмную триаду»: манипуляция решает задачу сегодня и строит клику, которая ударит по вам завтра."
    link: "events/meetup-2026-07-01"

  # --- джун на зрелом проекте ---
  - id: meetup-2026-07-01-junior-mature
    prompt: |-
      Проекту три года, доменной сложности выше крыши, всё горит.
      Кто-то предлагает взять джуна «на вырост». Ваш ход?
    options:
      - label: "Отказаться: на таком проекте джун полгода не принесёт value"
        good: false
        outcome: "Логично на сегодня. Но через год некого растить в мидлы, а бас-фактор только вырос."
      - label: "Взять и заодно упростить архитектуру, понизив порог входа"
        good: true
        outcome: "Джун работает как стресс-тест: вскрыл, где система переусложнена. Инвестиция в будущее и в бас-фактор."
      - label: "Взять джуна и бросить в бой – пусть разбирается сам"
        good: false
        outcome: "Без ведущего и без облегчения архитектуры джун буксует, а команда теряет время на подхват."
    lesson: "«Джун не вывозит» на зрелом проекте – чаще диагноз архитектуре, чем джуну. Сеньорность в том, чтобы сложное было простым."
    link: "articles/dzhuny-chya-otvetstvennost-rastit"

  # --- грейд против выслуги лет ---
  - id: week-2026-06-29-greid-vysluga
    prompt: |-
      Сотрудник 10 лет в компании и в одиночку тащит нишевый проект.
      Грейдинг показал уровень мидла. Он ждет сениора «за выслугу». Ваш ход?
    options:
      - label: "Дать сениора – человек столько лет держит проект на себе"
        good: false
        outcome: "Грейды превратились в табель о рангах за стаж. Сильные это видят – и прозрачность системы умирает первой."
      - label: "Честно показать мидла по критериям и предложить план роста"
        good: true
        outcome: "Возможно он обидится и уйдет. Это цена за прозрачность: система продолжает работать для всех остальных."
      - label: "Выбить статусную должность, не трогая грейд"
        good: false
        outcome: "Костыль: титул есть, скиллов нет. Через год тот же разговор, только обманутых ожиданий больше."
    lesson: "Платить за выслугу можно, грейдить за выслугу нельзя: грейд измеряет навыки, а не лояльность. А герой-одиночка на проекте – это риск, а не повод для сениорства."
    link: "insights/week-2026-06-29"

  # --- тесты как приёмка: отказ от чтения кода ---
  - id: meetup-2026-07-08-tests-as-acceptance
    prompt: |-
      LLM пишет код за копейки. Вам предлагают вообще не читать код –
      только писать приёмочные тесты, а реализацию отдать модели.
    options:
      - label: "Отказаться от чтения кода везде – тесты и есть приёмка"
        good: false
        outcome: "На простом CRUD прокатит, но на многопроцессной системе гонки и интеграции тесты поймают не всё – и отвечать за прод будет некому."
      - label: "Обложить приёмочными тестами и сузить контекст, но держать ревью там, где система сложная"
        good: true
        outcome: "Где всё изолировано – LLM почти детерминирована под тесты; где начинаются процессы и гонки – архитектор остаётся в контуре."
      - label: "Ревьюить каждую строку как раньше – модели не доверяем"
        good: false
        outcome: "Вы снова бутылочное горлышко и тратите дневной лимит решений на чтение чужого кода вместо тестов и границ."
    lesson: "Тесты как приёмка смещают ценность от кода к экспертизе тестирования – но это работает для несложных непроцессных систем на готовой платформе, а не везде."
    link: "events/meetup-2026-07-08"

  # --- локализация в «день 0» ---
  - id: meetup-2026-07-08-localization-day-zero
    prompt: |-
      Запускаете мультиязычный продукт. Сроки жмут, и проще перевести
      экраны автопереводом в ресурсные файлы, а «нормально» – потом.
    options:
      - label: "Перевести автопереводом сейчас, довести локализацию позже"
        good: false
        outcome: "«Потом» превращается во второй проект: ключи не размечены, контекста нет, и вы месяцами чините склейки слов и кривые строки."
      - label: "Заложить локализацию в «день 0»: ключи, контекст экрана, носители-ревьюеры"
        good: true
        outcome: "Медленнее на старте, зато фундамент есть: планы оцениваются честно, новый язык добавляется без переписывания."
      - label: "Пока выпустить только на английском, языки – когда будет спрос"
        good: false
        outcome: "Иногда разумно, но если мультиязычность неизбежна, вы просто отложили тот же дорогой рефакторинг."
    lesson: "Мультиязычность закладывают в «день 0»: перевод автопереводом в ресурсные файлы – это compliance-галочка, а не локализация."
    link: "events/meetup-2026-07-08"

  # --- видимая скорость против качества решений ---
  - id: meetup-2026-07-08-velocity-theater
    prompt: |-
      Бизнес в восторге: с LLM по борде каждый день ползут десятки мелких тасок.
      Вас просят держать этот темп «видимой скорости».
    options:
      - label: "Гнать максимум мелких PR-ов – бизнес видит прогресс в реальном времени"
        good: false
        outcome: "Видимость есть, но скорость съедает себя: качественных решений у человека фиксированное число в день, и растёт не результат, а суета."
      - label: "Показать скорость как жест доверия, но защитить темп принятия решений"
        good: true
        outcome: "Бизнесу спокойно, а вы не жжёте дневной лимит решений: скорость там, где она дёшева, вдумчивость – где дорого ошибиться."
      - label: "Игнорировать «театр» и просто делать по-своему"
        good: false
        outcome: "Возможно вы правы по сути, но без прозрачности бизнес читает это как «непонятно, что происходит» и давит сильнее."
    lesson: "Видимая скорость покупает доверие, но скорость сама по себе вредна: у человека фиксированный запас качественных решений в день – берегите его."
    link: "events/meetup-2026-07-08"

  # --- поведение на систем-дизайн интервью, когда «лимитов нет» ---
  - id: week-2026-07-06-sysdesign-no-limits
    prompt: |-
      На систем-дизайн интервью вы просите нагрузку и SLA, а вам говорят: «жестких требований нет, лимитов нет».
      Дальше решать вам.
    options:
      - label: "Самому задать рамку: озвучить разумные допущения вслух и проговорить trade-offs"
        good: true
        outcome: "Интервьюер видит инженера, который держит неопределенность: вы ведете диалог, а не ждете разрешения, и решение растет из ваших же вопросов."
      - label: "Построить простейшее наихудшее решение – «потом подкрутим, если попросят»"
        good: false
        outcome: "Читается как «мне не сказали, значит сделаю на отвали». Отсутствие ограничений – это приглашение задать рамку, а не разрешение халтурить."
      - label: "Заложить максимум на всякий случай: георепликация, PCI-DSS, кластеры"
        good: false
        outcome: "Переусложнение без требований – такой же провал: вы решаете задачи, которых никто не ставил, и теряете время на несуществующие проблемы."
    lesson: "«Ограничений нет» проверяет не память по архитектуре, а умение самому задать разумную рамку и проговорить компромиссы."
    link: "insights/week-2026-07-06"

  # --- задача без прямого денежного импакта ---
  - id: week-2026-07-06-profit-proxy
    prompt: |-
      Инженер хочет переделать внутренний интерфейс контент-менеджеров. Прямого влияния на конверсию нет, A/B ничего не покажет.
      Он говорит, что людям станет заметно удобнее работать.
    options:
      - label: "Оценить по здравому смыслу и прокси-сигналам, не требуя денежного A/B"
        good: true
        outcome: "Часть ценной работы (UX, надежность, скорость команды) не имеет прямого A/B. Прокси-метрики и здравый смысл тут дешевле и не менее надежны."
      - label: "Отклонить: нет измеримого импакта на деньги – нет задачи"
        good: false
        outcome: "Так вы обесцениваете половину инженерной работы, которая держит продукт незаметно. Кнопка logout тоже «не приносит прибыли»."
      - label: "Согласовать только после того, как посчитаете ROI в деньгах"
        good: false
        outcome: "Свести каждую прокси-метрику к деньгам долго, дорого и хрупко. Пока считаете ROI внутренней фичи, команда теряет время дороже самой фичи."
    lesson: "Не каждая задача обязана показывать денежный импакт: прокси-метрики и инженерный здравый смысл дешевле точного ROI и часто не менее эффективны."
    link: "insights/week-2026-07-06"

  # --- автономный development loop и бюджет на токены ---
  - id: meetup-2026-07-15-dev-loop-budget
    prompt: |-
      Инженер хочет попробовать автономные development loops – агент сам крутит задачу до готовности.
      Но один прогон большой задачи может сжечь 100+ долларов за вечер, и заказчик смотрит на бюджеты.
    options:
      - label: "Дать маленькую задачу с гардрейлом на бюджет ($5-10 за прогон) и требовать воспроизводимый результат"
        good: true
        outcome: "Луп окупается: на узкой задаче с constraints и тестами вы получаете воспроизводимый результат, который можно показать заказчику как «второго джуна» – без сюрпризов в счете."
      - label: "Запретить: дорого и не проверено, подождем, пока подешевеет"
        good: false
        outcome: "Безопасно для счета, но вы гасите обучение: конкуренты нащупают, где лупы дешевы и работают, а вы останетесь с теорией и без своего харнеса."
      - label: "Дать большую фичу целиком – так честнее проверить потолок технологии"
        good: false
        outcome: "Бюджет сгорает вслепую: без гардрейлов и узкого скоупа луп путается на большой задаче, а вы получаете дорогой непредсказуемый результат и косые взгляды на бюджеты."
    lesson: "Автономные лупы окупаются на маленьких, обложенных тестами задачах с гардрейлами на бюджет – это дает воспроизводимость. Большой прогон вслепую жжет деньги, а полный запрет убивает обучение."
    link: "events/meetup-2026-07-15"

  # --- долгоживучесть «ваншотнутого» инструмента ---
  - id: meetup-2026-07-15-oneshot-longevity
    prompt: |-
      Инженер за вечер «ваншотнул» с LLM маленькую внутреннюю утилиту. Она работает, и команда уже начала ей пользоваться.
      Инструмент потихоньку становится нагруженным – от него зависят другие.
    options:
      - label: "Пока не стал критичным – попросить короткую спеку и интеграционные тесты, ровно сколько нужно"
        good: true
        outcome: "Инструмент переживает следующую итерацию: есть скоп видимости и приемка, и LLM при доработке не тащит старье и не ломает то, что уже работает."
      - label: "Оставить как есть – работает же, не надо золотить"
        good: false
        outcome: "До первой доработки: без тестов и спеки LLM однажды тихо напортачит в нагруженном месте, и чинить будете дороже, чем стоило описать сразу."
      - label: "Раз стал важным – навесить полный spec-kit и тяжелый процесс"
        good: false
        outcome: "Другой перекос: монструозная бюрократия вызывает отторжение, инструмент перестают развивать, и вся легкость «ваншота» теряется."
    lesson: "Ваншот легко раздуть, но чтобы инструмент жил, нужен минимум дисциплины – короткая спека и интеграционные тесты. «Оставить как есть» ломается на первой доработке, полный spec-kit – душит."
    link: "events/meetup-2026-07-15"
  # --- качество местных конференций: критика или содействие ---
  - id: week-2026-07-13-conference-critique
    prompt: |-
      Вас не устраивает качество докладов местных конференций: «делали как в умных книгах – стало хорошо», ноль цифр «до» и «после».
      В профессиональном чате как раз обсуждают анонс очередного митапа. Ваш ход?
    options:
      - label: "Публично разнести организаторов и уровень докладов в чате"
        good: false
        outcome: "Критика без предложения читается как поливание. Организаторы закрываются, потенциальные спикеры пугаются, а планка не двигается – желающих выступать и так мало."
      - label: "Пройти мимо: рынок маленький, хорошо что хоть что-то проводят"
        good: false
        outcome: "Терпимость к болоту консервирует его. Годы идут, качество в среднем не растет, а сильные специалисты уходят за контентом в ютуб и на чужие конференции."
      - label: "Войти в программный комитет или менторить спикеров, требуя цифры"
        good: true
        outcome: "Опыт программных комитетов показывает: когда смотр заявок требует метрики и выводы, спикеры их добавляют. Медленно, но планка растет – руками, а не словами."
    lesson: "Планку докладов поднимает не критика в чате и не терпимость к слабому уровню – а работа в программном комитете и обкатка докладов на митапах перед большой сценой."
    link: "insights/week-2026-07-13"
  # --- выбор модели: бенчмарки, «на глаз» или свои эвалы ---
  - id: week-2026-07-13-model-eval
    prompt: |-
      Вышла новая модель и обошла вашего фаворита в публичных лидербордах. Команда просит перевести на нее агентские пайплайны.
      Решение за вами. Как проверите?
    options:
      - label: "Перейти: публичные бенчмарки и слепая арена объективнее ощущений"
        good: false
        outcome: "Лидерборды меряют чужие сценарии. На ваших скиллах и пайплайнах модель может проваливаться – и вы узнаете об этом уже в проде."
      - label: "Прогнать пару своих задач руками и решить на глаз"
        good: false
        outcome: "Так делают 99,99% – и получают впечатление вместо данных. Один удачный ответ ничего не говорит о сотне сценариев, где модель поведет себя иначе."
      - label: "Собрать маленький набор своих эвалов и гонять каждую новую модель"
        good: true
        outcome: "Даже дешевый набор эвалов на реальных сценариях команды говорит о модели больше любого лидерборда – и превращает смену модели из ставки в рутину."
    lesson: "Публичные бенчмарки меряют чужую работу. Свои эвалы на своих сценариях – единственный способ узнать, как модель поведет себя именно у вас."
    link: "insights/week-2026-07-13"
  # --- окно для выплаты организационного долга ---
  - id: meetup-2026-07-22-debt-window
    prompt: |-
      Единственный носитель знаний по проекту внезапно выбыл, и вы аварийно поднимаете систему с нуля: доступы, конфигурации, процесс.
      Клиент напуган, работа горит, документации нет никакой.
    options:
      - label: "Сначала запустить любой ценой, документацию написать потом, когда разберетесь"
        good: false
        outcome: "Запустить получится, а документация не появится: половина мелочей забудется через неделю, конфигурация уйдет в дрифт, и следующий человек будет копать ровно там же."
      - label: "Вести заметки прямо по ходу раскопок и сразу показывать клиенту, чего не хватает"
        good: true
        outcome: "Заметки, написанные пока вы сами ничего не понимаете, и есть база документации. А в момент аврала клиент максимально замотивирован – это единственное окно, когда он готов платить за организационный долг."
      - label: "Сначала выбить у клиента отдельный бюджет и сроки на документирование"
        good: false
        outcome: "Пока согласуете смету, окно закроется: система запустится, паника уляжется, и деньги на документацию снова станут «потом»."
    lesson: "Катастрофа – единственный момент, когда бизнес готов платить организационный долг. Документируйте по ходу изучения, а не «когда разберусь»."
    link: "events/meetup-2026-07-22"
  # --- новый сеньор на чужом легаси: какие задачи давать ---
  - id: meetup-2026-07-22-senior-is-junior
    prompt: |-
      На старый проект без документации выходит сильный сеньор и просит сразу дать ему крупный кусок: «разберусь по ходу, давайте рефакторинг».
      Проект знаете только вы, и времени на сопровождение мало.
    options:
      - label: "Дать крупный кусок – он сеньор, справится и заодно быстрее войдет"
        good: false
        outcome: "На чужом проекте он джун независимо от грейда. Без точек входа и понимания связей рефакторинг превращается в раскопки вслепую, а вы все равно тратите время – только на разбор последствий."
      - label: "Дать маленькую задачу под присмотром, потом вторую, и требовать пробный прогон на исторических данных"
        good: true
        outcome: "Первое успешное изменение подтверждает, что он понял, а прогон на golden data проверяет это фактами. Ownership набирается уровнями, и так вы видите, на каком он сейчас."
      - label: "Посадить читать код и документировать, пока не разберется целиком"
        good: false
        outcome: "Чтение без изменений не дает подтвержденного понимания: человек прочитал, но ни разу не проверил себя на практике – и остается туристом в проекте."
    lesson: "На новом проекте любой сеньор – джун. Компетенцию определяет не грейд, а уровень владения этим компонентом, и перепрыгнуть уровни нельзя."
    link: "events/meetup-2026-07-22"
  # --- некому проектировать вдолгую: вырастить, нанять или начать мерить ---
  - id: week-2026-07-20-inhouse-architect
    prompt: |-
      В команде некому проектировать систему на годы вперед: решения принимаются по ситуации и переделываются каждый квартал.
      Есть лояльный инженер с десятью годами в компании, есть бюджет на редкого внешнего архитектора и есть возможность ничего не менять в людях.
    options:
      - label: "Растить своего: он знает продукт, дать ему архитектурную роль и обучение"
        good: false
        outcome: "Человек, который десять лет не видел других способов работать, вырастет экспертом по вашему легаси. Он закрепит текущие решения как единственно возможные, и цена этой ошибки измеряется годами."
      - label: "Сначала завести измерение операционных показателей и принимать решения по данным"
        good: true
        outcome: "Дефицит архитектуры почти всегда вторичен по отношению к тому, что решения принимаются без цифр. Когда появляется измеримая обратная связь, требования к системе становятся проверяемыми, и сильные инженеры подтягиваются сами."
      - label: "Нанять снаружи сильного системщика с опытом долгоживущих систем"
        good: false
        outcome: "Найм закроет навык, но не привычку решать без данных. Через полгода архитектор упрется в руководство, которое по-прежнему выбирает по интуиции, и уйдет."
    lesson: "Навык долгосрочного проектирования вырастает там, где есть измеримая обратная связь. Без нее вы наймете архитектора в среду, которая его отторгнет."
    link: "insights/week-2026-07-20"
  # --- CI, который моргает: экономить ресурсы или чинить сигнал ---
  - id: week-2026-07-20-flaky-ci-signal
    prompt: |-
      В вашем репозитории при частых коммитах старые прогоны CI отменяются ради экономии раннеров: на один завершенный прогон приходится пять остановленных.
      Понять, какой именно коммит что сломал, по истории билдов невозможно, но релизы пока выходят.
    options:
      - label: "Оставить как есть: релизы идут, а упавшую сборку всегда можно найти бинарным поиском"
        good: false
        outcome: "Это работает ровно до тех пор, пока проект держит один человек в голове. При первой болезни, отпуске или увольнении команда остается с CI, который ничего не сообщает."
      - label: "Гонять полный прогон только на защищенной ветке и хранить его историю, на промежуточных коммитах – быстрый набор"
        good: true
        outcome: "Вы платите за раннеры там, где сигнал действительно нужен, и получаете воспроизводимую историю. Экономия сохраняется, а вопрос «что сломалось и когда» снова имеет ответ."
      - label: "Вернуть полный прогон на каждый коммит без отмен – надежность важнее счета за CI"
        good: false
        outcome: "Счет вырастет кратно, а очередь прогонов начнет отставать от коммитов. Через месяц вы вернетесь к отменам, только уже с испорченным разговором про бюджет."
    lesson: "Ненадежный CI хуже отсутствующего: он создает видимость проверки. Сокращать надо объем прогонов, а не сохранность сигнала."
    link: "insights/week-2026-07-20"
  # --- тайная параллельная реализация против решения команды ---
  - id: week-2026-08-02-secret-branch
    prompt: |-
      Вы не согласились с оценкой команды в четыре месяца и втихую сделали свою версию интеграции за две недели – она работает, покрыта тестами и втрое короче.
      Команда выпустила свою через пять месяцев, компания потеряла месяц оборота, и в их коде вы нашли два бага, которые у вас закрыты. Через два дня квартальная встреча.
    options:
      - label: "Показать обе версии на встрече: цифры строк, сроки и найденные баги говорят сами за себя"
        good: false
        outcome: "Вы выигрываете спор и теряете команду. Ваша ветка не прошла ревью, QA и нагрузку, так что сравнение нечестное, а публичный разбор превращает инженерную ошибку в личное поражение – после такого решения будут прятать, а не обсуждать."
      - label: "Отдать команде два бага сразу и без контекста, а на встрече разбирать не код, а почему пять месяцев никто не пересмотрел оценку"
        good: true
        outcome: "Баги чинятся сегодня, а не после вашего триумфа. Разговор про механизм остановки и пересмотра решений – единственный, который меняет следующий проект: проблема была не в архитектуре, а в том, что четыре месяца никто не имел права нажать на тормоз."
      - label: "Выкинуть свою ветку и промолчать – ваше дело управлять, а не писать код"
        good: false
        outcome: "Вы сохраняете отношения и консервируете причину. Через квартал команда снова построит платформу под одного клиента, а вы снова будете смотреть на это молча."
    lesson: "Тайная ветка доказывает не вашу правоту, а что в компании не работает пересмотр решений. Знание о багах – не козырь, а информация, которая устаревает каждый день."
    link: "insights/week-2026-07-27"
  # --- консенсус агентов на одной модели ---
  - id: week-2026-08-02-agent-consensus
    prompt: |-
      Вы собираете агентный пайплайн для проверки рискованных решений и хотите повысить надежность ответа.
      Времени на сложную схему нет, бюджет на прогоны есть.
    options:
      - label: "Прогнать задачу тремя агентами и принять ответ, на котором сошлись минимум двое"
        good: false
        outcome: "Агенты на одной модели, одном промпте и одном контексте дают зависимые голоса. Их согласие – это общая ошибка, поданная как уверенность, и именно единогласие сильнее всего сбивает модель с верного ответа."
      - label: "Развести агентов по моделям и ролям, передавать дословный контекст и обязательно доносить несогласный голос до финального решения"
        good: true
        outcome: "Работает не количество голосов, а их независимость. Достаточно одного сохраненного возражения, чтобы модель удержалась на верном ответе, а дословная цитата вместо пересказа не подсовывает ей чужие слова как свои."
      - label: "Прогнать один раз и переспросить модель «ты уверен?», приняв уточненный ответ"
        good: false
        outcome: "Переспрашивание давит на модель, не добавляя фактов: часть моделей на этом теряет уверенность и начинает галлюцинировать. Вы получаете другой ответ, а не более верный."
    lesson: "Надежность агентной схемы определяется независимостью голосов, а не их числом. Резюме «расхождений нет» стирает ровно тот голос, который держал верный ответ."
    link: "insights/week-2026-07-27"
  # --- тимлид внутреннего продукта, где никто не говорит с пользователями ---
  - id: week-2026-08-09-internal-product
    prompt: |-
      Вас сделали тимлидом внутреннего продукта: два разработчика год пишут систему, но с пользователями из соседнего департамента не общаются и обвиняют друг друга.
      Пользователи работу делают, а дополнительную нагрузку от новой системы тихо саботируют. Заказчик недоволен, продакта на проекте нет.
    options:
      - label: "Взять коммуникацию с пользователями на себя – вы и стали лидом за умение договариваться"
        good: false
        outcome: "Вы закрываете симптом собой и становитесь единственным каналом между командой и реальностью. Разработчики окончательно перестают видеть пользователя, а вы через квартал упретесь в потолок собственного времени."
      - label: "Формализовать внутреннего заказчика с его руководством, найти среди пользователей союзника и завязать метрику команды на их довольство"
        good: true
        outcome: "Саботаж пользователей – это отсутствие у них интереса, а не вредность, и лечится он на уровне их руководства. Общая метрика возвращает команде результат, ради которого стоит разговаривать с людьми напрямую."
      - label: "Начать с внутренней части: разобрать конфликт бекенда и фронта, а к пользователям идти, когда команда договорится"
        good: false
        outcome: "Ссора внутри команды – следствие того, что год никто не видел результата своей работы. Без внешнего сигнала мирить их бесполезно: через месяц взаимные претензии вернутся в новой формулировке."
    lesson: "Равнодушие к результату лечится не разговором про командность, а возвращением команде видимого заказчика и общей метрики."
    link: "insights/week-2026-08-03"
  # --- слишком решительный сотрудник ---
  - id: week-2026-08-09-decisive-engineer
    prompt: |-
      В команде есть опытный и очень решительный инженер: он быстро реализует то, во что верит, и пока его убеждения совпадали с реальностью, это приносило результат.
      Сейчас вы видите, что несколько его убеждений устарели, а скорость осталась прежней.
    options:
      - label: "Замедлить его: согласовывать значимые изменения с вами до начала работы"
        good: false
        outcome: "Вы получаете микроменеджмент под другим названием и убиваете ровно то качество, за которое человека держали. Скорость упадет у всей команды, а он начнет искать место, где решать разрешают."
      - label: "Расширить зону ответственности и поставить подпорки: чеклист на релизах, разбор его же ошибок, право решать внутри границ"
        good: true
        outcome: "Ответственность делает последствия видимыми ему самому, а подпорки ловят явные глупости, не трогая скорость. Вы контролируете ошибки, а не работу, и человек учится минимизировать риск сам."
      - label: "Оставить как есть – переубеждать взрослого специалиста бесполезно, а результат он пока приносит"
        good: false
        outcome: "Устаревшие убеждения не исчезнут сами, а цена решения растет вместе с его влиянием. Вы узнаете о расхождении в момент, когда чинить будет дороже всего."
    lesson: "Решительность гасить дорого и бессмысленно: ей нужны границы и ответственность, внутри которых ошибка становится заметной раньше, чем дорогой."
    link: "insights/week-2026-08-03"
  # --- один агент на репу против оркестрации по границам архитектуры ---
  - id: week-2026-08-16-agent-conway
    prompt: |-
      Команда полгода гоняет одного агента на всю репозиторию в одном длинном потоке. Скорость высокая, но код расползается в связное месиво, и каждая новая задача цепляет половину сервисов.
      Вы решаете, как перестроить работу с агентами.
    options:
      - label: "Собрать все репозитории в одну папку и написать общий файл контекста со связями и конвенциями"
        good: false
        outcome: "Агент начнет видеть систему целиком – и связывать ее еще плотнее. Общий контекст удобен людям, но модели он разрешает лезть куда угодно, и монолитность из кода никуда не денется."
      - label: "Нарисовать архитектуру, которую вы хотите получить, и завести по субагенту на каждую ее границу"
        good: true
        outcome: "Структура диалога отпечатывается в структуре кода, поэтому границы стоит задать раньше, чем начнется генерация. Субагент на сервис заодно держит контекст небольшим, а значит и ошибок в нем меньше."
      - label: "Оставить одного агента, но усилить ревью: месиво разберет человек на входе в мастер"
        good: false
        outcome: "Вы делаете ревьюера бутылочным горлышком у конвейера, который работает быстрее него. Разбор чужого спагетти обходится дороже, чем не производить его."
    lesson: "Закон Конвея работает и с агентами: как вы нарезали диалог, так и нарежется код. Сначала архитектура, потом оркестрация."
    link: "insights/week-2026-08-10"
  # --- покрытие 92%, а баг все равно в проде ---
  - id: week-2026-08-16-mutation-testing
    prompt: |-
      В проде всплыл баг в расчете процентов: в одной стране округление до трех знаков, а не до двух. Класс покрыт тестами на 92%, и команда считала его пуленепробиваемым.
      Выборочный просмотр показывает, что половина тестов проверяет только, что поле пришло.
    options:
      - label: "Дотянуть покрытие до 100% и добавить недостающие кейсы округления"
        good: false
        outcome: "Покрытие говорит, что строка выполнилась, а не что тест поймает ее поломку. Вы допишете тесты того же качества и закроете ровно тот кейс, который уже нашли в проде."
      - label: "Раз в месяц прогонять мутационное тестирование и разбирать выжившие мутации"
        good: true
        outcome: "Инструмент ломает код специально – меняет знаки, выкидывает условия – и показывает тесты, которые этого не заметили. Это единственная проверка, которая говорит о самих тестах, а не о строчках."
      - label: "Ввести обязательное ревью тестов вторым инженером на каждом пулреквесте"
        good: false
        outcome: "Глазами такое ловится плохо: Assert.NotNull выглядит как нормальный тест и на ревью, и через год. Вы платите временем двух человек за проверку, которую машина делает за два часа в месяц."
    lesson: "Покрытие меряет выполненные строки, а не качество тестов. Проверять тесты умеет только тот, кто их ломает."
    link: "insights/week-2026-08-10"
  # --- тысяча откликов и соблазн найти лучшего ---
  - id: week-2026-08-23-resume-pile
    prompt: |-
      На вакансию в вашу команду пришла тысяча откликов, рекрутер отдал их вам целиком. Нужно взять двух инженеров, дальше по этапам вы ведете кандидатов сами.
      Разбор одного резюме занимает пару минут, свободного времени у вас нет.
    options:
      - label: "Прогнать всю тысячу через агента с профилем вакансии и отранжировать по соответствию"
        good: false
        outcome: "Вы автоматизировали полный перебор вместо того, чтобы от него отказаться. Ранжирование по формальному соответствию поднимет наверх тех, кто лучше написал резюме, а не тех, кто лучше работает."
      - label: "Отсечь выборку до десятка по одному-двум жестким критериям и вести дальше первых достаточно хороших"
        good: true
        outcome: "Вам нужен не лучший из тысячи, а первый подходящий и адекватный. Сужение выборки в начале стоит дешево, а разница в качестве между лучшим и достаточно хорошим почти всегда меньше, чем цена месяца поиска."
      - label: "Расширить критерии и посмотреть всех: среди тысячи наверняка есть сильные, которых формальный фильтр отрежет"
        good: false
        outcome: "Пока вы идете по списку, сильные кандидаты выходят на другие офферы. Полный перебор дает не лучший выбор, а самый долгий, и первыми из воронки уходят как раз те, за кем вы шли."
    lesson: "Найм – задача о разборчивой невесте: цель не лучший из тысячи, а первый достаточно хороший, найденный быстро."
    link: "insights/week-2026-08-17"
  # --- команда энтузиастов хочет делать продукт ---
  - id: week-2026-08-23-value-hypothesis
    prompt: |-
      Инженеры вашей команды загорелись идеей побочного продукта: боль реальная, все ее чувствуют на себе, репозиторий завели за полчаса.
      Ни одного будущего пользователя в обсуждении нет, а формулировок проблемы уже прозвучало три разные.
    options:
      - label: "Дать команде две недели на прототип – работающая версия быстрее любых разговоров покажет, попали вы или нет"
        good: false
        outcome: "Прототип покажет только то, что вы умеете писать код. Три разные формулировки проблемы означают три разных продукта, и какой из них вы собрали, выяснится уже после того, как потрачен запал команды."
      - label: "Собрать пять разговоров с теми, у кого эта боль есть на работе, и только потом выбирать, что строить"
        good: true
        outcome: "Пять разговоров стоят вечера и снимают главный риск – что боль есть у вас, а не у рынка. Заодно из трех формулировок останется одна, и команда будет строить ее, а не спорить о ней."
      - label: "Свернуть затею: у команды нет ни продакта, ни доступа к клиентам, а основной проект никто не отменял"
        good: false
        outcome: "Вы гасите редкий момент, когда инженеры сами хотят разобраться в чужой проблеме. Проверка гипотезы стоит несколько вечеров, а отказ обходится в мотивацию, которую потом не вернуть распоряжением."
    lesson: "Энергия команды – ресурс дорогой и короткий: сначала подтвердите, чья это боль, потом тратьте его на код."
    link: "insights/week-2026-08-17"
  # --- локальное железо против подписок на модели ---
  - id: week-2026-08-30-iron-vs-subscription
    prompt: |-
      Руководство хочет уйти с подписок на модели и купить свой кластер: платить каждый месяц кажется дороже, чем один раз за железо.
      Часть данных действительно нельзя отдавать наружу, но какая именно и сколько ее – никто не считал.
    options:
      - label: "Согласовать закупку кластера: железо окупится за год, а данные останутся внутри периметра"
        good: false
        outcome: "Цена токена падает быстрее, чем дешевеет железо, и через год ваш актив отстанет на поколение. Плюс обвязка, питание и админы, которых в смету обычно не кладут, стоят дороже самих карт."
      - label: "Разметить данные, вынести локально только ту долю, которой нельзя наружу, остальное оставить на подписках"
        good: true
        outcome: "Вы платите за железо ровно там, где есть требование, которое нельзя обойти, и не фиксируете капитал в дешевеющем ресурсе. Заодно появляется цифра, с которой можно вернуться к разговору через квартал."
      - label: "Остаться на подписках и запретить отправлять чувствительные данные во внешние модели"
        good: false
        outcome: "Запрет без разметки данных не исполняется: люди не знают, что считается чувствительным. Вы получаете и риск, и иллюзию контроля, а к вопросу о железе вернетесь после первого инцидента."
    lesson: "Локальное железо покупают под требование к данным, а не ради экономии: токены дешевеют быстрее, чем железо."
    link: "insights/week-2026-08-24"
  # --- модель после обновления просела в одном измерении ---
  - id: week-2026-08-30-model-regression
    prompt: |-
      После обновления ваша основная модель стала заметно хуже объяснять: код прежний, а тексты, планы и промпты для сабагентов – многословная каша.
      Команда предлагает переехать всем стеком к другому поставщику.
    options:
      - label: "Переехать: если поставщик ломает то, на что вы опирались, дальше будет только хуже"
        good: false
        outcome: "Переезд стека стоит недели, а вы меняете известную регрессию на неизвестные. Через месяц ровно так же обновится и новый поставщик, и решать придется заново."
      - label: "Закрепить прежнюю версию и отдать пострадавшую роль второй модели, оставив основную на коде"
        good: true
        outcome: "Вы чините то измерение, которое просело, и не платите за миграцию всего остального. Разделение ролей по сильным сторонам заодно снимает зависимость от одного поставщика."
      - label: "Остаться как есть и добить промптами: попросить писать кратко и запретить лишние файлы"
        good: false
        outcome: "Промпт лечит симптом на верхнем уровне, но задачи сабагентам ставит все та же модель. Деградация уходит на уровень ниже, где вы ее уже не увидите глазами."
    lesson: "Качество модели не одномерно: сначала поймите, какое измерение просело, и чините его, а не меняйте весь стек."
    link: "insights/week-2026-08-24"
  # --- требование, которое нельзя проверить машиной ---
  - id: week-2026-08-31-verifiable-requirement
    prompt: |-
      Вы третью неделю пишете в инструкциях агента, что вся тяжелая логика должна уходить на GPU, а ревью другим агентом подтверждает: все выполнено.
      Приложение при этом стабильно выдает десять кадров в секунду.
    options:
      - label: "Усилить формулировку в инструкциях и добавить примеры правильного кода"
        good: false
        outcome: "Правило, которое нельзя проверить машиной, выполняется недетерминированно. Вы получите более убедительные отчеты о выполнении и ту же производительность."
      - label: "Написать исполняемый гейт: тест на миллион объектов с порогом по времени"
        good: true
        outcome: "Требование превращается в красную или зеленую лампочку, и агент чинит реальную причину, а не переписывает объяснения. Заодно порог фиксирует регрессию на будущее."
      - label: "Поставить второго агента-ревьюера, который проверяет соответствие требованию"
        good: false
        outcome: "Ревьюер отчитается, что все покрыто на сто процентов, потому что оценивает тот же текст теми же глазами. Театр проверки обходится в токены и не ловит ничего."
    lesson: "Требование к агенту стоит ровно столько, сколько стоит гейт, который его проверяет."
    link: "insights/week-2026-08-31"
  # --- продукт лучше, а выбирают старожила ---
  - id: week-2026-08-31-trust-over-features
    prompt: |-
      Ваша платформа объективно удобнее конкурента, но крупные клиенты выбирают игрока, который на рынке десять лет.
      Команда предлагает уронить цену вдвое, чтобы забрать первых клиентов.
    options:
      - label: "Снизить цену вдвое и заходить через стоимость владения"
        good: false
        outcome: "Демпинг привлекает тех, кто уйдет за следующей скидкой, и подтверждает подозрение, что у вас нет другого аргумента. Крупный клиент выбирает не по цене, а по риску."
      - label: "Открыть код платформы и параллельно сузиться до ниши, где вы объективно лучший"
        good: true
        outcome: "Прозрачность заменяет ту историю, которой у вас пока нет, а ниша дает первые референсы. Доверие накапливается быстрее, чем возраст компании."
      - label: "Вложиться в маркетинг и сертификации, чтобы выглядеть солиднее"
        good: false
        outcome: "Витрина не отвечает на вопрос, что будет с данными клиента через год. Бюджет уходит, а разговор с крупным клиентом упирается в тот же вопрос о рисках."
    lesson: "На рынке, где решает доверие, прозрачность работает быстрее, чем цена и витрина."
    link: "insights/week-2026-08-31"
  # --- счет за модели растет: как маршрутизировать задачи ---
  - id: week-2026-09-07-model-routing
    prompt: |-
      Счет за агентов на вашем проекте перевалил за сотню долларов, и все задачи по привычке идут в самую дорогую модель.
      Команда просит либо урезать бюджет, либо объяснить, за что платим.
    options:
      - label: "Перевести все задачи на дешевую модель – разница в качестве на глаз не видна"
        good: false
        outcome: "Счет падает, а вместе с ним тихо падает качество там, где выбор инварианта требовал суждения. Вы узнаете об этом не из счета, а из багов на стыках через месяц."
      - label: "Разобрать последние двести задач и завести правило: дешевая модель по умолчанию, дорогая только там, где дешевая не справилась"
        good: true
        outcome: "Выясняется, что около девяти из десяти задач при детальном брифе закрывает дешевая модель. Счет падает втрое, а дорогая модель остается там, где она действительно нужна – в планировании и выборе инвариантов."
      - label: "Оставить как есть: сто долларов – это меньше дня работы разработчика"
        good: false
        outcome: "Аргумент верный, но он маскирует главное: задачи, которые вы не умеете ставить дешевой модели, вы не умеете ставить вообще. Дорогая модель просто дороже додумывает за вас."
    lesson: "Экономия на моделях – это не выбор модели, а качество постановки: дешевая модель справляется ровно там, где приемку можно записать заранее."
    link: "insights/week-2026-09-07"
  # --- показать пустую платформу или сначала наполнить ---
  - id: week-2026-09-07-empty-platform
    prompt: |-
      Вы за несколько ночей с агентом собрали портал для локальных клубов и хотите показать его сообществу программистов на бета-тест.
      Пользователей на портале пока ноль, зато готовы клубы, профили, блог и почти готов телеграм-бот.
    options:
      - label: "Показать сразу как есть – цель беты найти ошибки новичка в деплое и безопасности, а не функционал"
        good: false
        outcome: "Вы получаете ревью верстки и склонений вместо ревью идеи: без контента тестировщикам не за что зацепиться, а первое впечатление «мертвая платформа» второй раз не переиграть."
      - label: "Сначала завести руками несколько реальных мастеров и пару анонсов, и только потом показывать"
        good: true
        outcome: "Одного клуба и двух анонсов хватает, чтобы тестировщики пошли по реальному сценарию и нашли то, что глаз автора уже не видит. Заодно первые пользователи станут первыми амбассадорами."
      - label: "Доделать телеграм-бота и блог, чтобы к показу платформа выглядела полной"
        good: false
        outcome: "Функционала становится еще больше, а пользователей все так же ноль. Каждый новый раздел – еще одно пустое место, которое надо наполнять, и еще одна страница с заглушками на бета-тесте."
    lesson: "Самое сложное в социальной платформе – не сайт, а критическая масса; показывайте продукт, когда в нем есть за что зацепиться."
    link: "insights/week-2026-09-07"
  # --- чужой проект без документации и жесткий дедлайн ---
  - id: week-2026-09-14-inherited-deadline
    prompt: |-
      Вашей команде передали проект без документации и внятной архитектуры: модулей много, связи дублируются, тестов нет.
      К концу года его нужно серьезно допилить, нанять некого, уйти с проекта нельзя.
    options:
      - label: "Глушить издержки быстро: латать по месту и успеть к дедлайну любой ценой"
        good: false
        outcome: "К дедлайну вы успеваете, но каждая следующая фича в этом коде дороже предыдущей. Через полгода «поддержка и расширение» превращаются в постоянный пожар, а бизнес уже привык к потогонке."
      - label: "Сначала переписать основу как следует, даже с риском не успеть к сроку"
        good: false
        outcome: "Через три месяца у вас наполовину переписанная система, две версии поведения и сорванный срок. Основательность без запаса времени оборачивается тем же долгом, только с дополнительным слоем."
      - label: "Не оставлять за собой хаос: по одному тесту, CI, разбор медленного билда, а сроки называть самим с запасом на улучшения"
        good: true
        outcome: "В таком проекте «конь не валялся», и маленькие шаги дают максимум пользы за минимум телодвижений. Каждая задача оставляет код чуть лучше, а запас в сроках делает улучшения частью работы, а не подвигом."
    lesson: "В заброшенном проекте выигрывает не скорость и не основательность, а правило не оставлять хаос после каждой задачи – и сроки, которые команда называет сама."
    link: "insights/week-2026-09-14"
  # --- ИИ в SDLC на личных подписках разработчиков ---
  - id: week-2026-09-14-personal-subscriptions
    prompt: |-
      Вы внедряете агентов в цикл разработки: автоматическое ревью PR, разбор упавших тестов, гейты в CI.
      Бюджета на API нет, зато у всех разработчиков есть личные подписки по 20–200 долларов.
    options:
      - label: "Подключить личные подписки к CI через OAuth – технически это работает и почти бесплатно"
        good: false
        outcome: "Пайплайн живет до первого упершегося лимита или блокировки: это нарушение политики вендора, лимиты при автозапуске кончаются быстро, и решение постоянно отваливается. Процесс держится на чужих аккаунтах."
      - label: "Выбить небольшой бюджет на API для автоматизации, а личные подписки оставить как второго пилота"
        good: true
        outcome: "Расходы на токены сначала гуляют в широком коридоре, но теперь они видны и их можно оптимизировать, вплоть до перехода на модели в разы дешевле. Автоматизация становится частью процесса, а не колхозом."
      - label: "Отказаться от автоматизации: пусть каждый пользуется агентом локально как хочет"
        good: false
        outcome: "Работать становится удобнее, но SDLC не меняется – это небольшая модернизация. Проверки остаются на совести каждого, и команда с разными стилями работы начинает спорить, кто что проверял."
    lesson: "Без оплаченного API внедрение ИИ в SDLC – это личные подписки разработчиков, то есть модернизация, а не новый процесс; бюджет на токены нужно назвать до пилота."
    link: "insights/week-2026-09-14"
  # --- тесты зеленые, а фичей пользоваться нельзя ---
  - id: week-2026-09-21-user-journey-reviewer
    prompt: |-
      Агенты закрывают задачи в вашем приложении, тесты и UI-тесты зеленые, на скриншотах все на месте.
      Но вы берете телефон – и фичей пользоваться неудобно или невозможно, а каждая доработка рождает новые баги.
    options:
      - label: "Дописать больше UI-тестов на каждую найденную проблему"
        good: false
        outcome: "Тесты исправно ловят, что старое не сломалось, но «удобно ли пользоваться» в них не записывается. Вы продолжаете вручную тестировать и отчитываться о доработках, то есть микроменеджить агента."
      - label: "Начать самому читать весь код, который пишет агент"
        good: false
        outcome: "В незнакомом стеке вы не знаете даже, что искать, а код растет быстрее, чем вы читаете. Проблема не в коде, а в том, что никто не смотрит на результат глазами пользователя."
      - label: "Поставить агента-ревьюера, который принимает задачу по зарегистрированному user journey и решает, что доделать"
        good: true
        outcome: "Цикл «воркер делает – ревьюер принимает с точки зрения пользователя» закрывает то, что не ловили тесты, и агенты доводят работу до конца без вашего ручного тестирования после каждой задачи."
    lesson: "Измеримое требование записывайте в тест, а неизмеримое «этим удобно пользоваться» отдавайте приемке по сценарию пользователя – пусть даже машинной."
    link: "insights/week-2026-09-21"
  # --- менеджер раз за разом дает шанс тому, кто срывает работу ---
  - id: week-2026-09-28-indecisive-manager
    prompt: |-
      В небольшой команде один сотрудник регулярно срывает свою часть работы, команда жалуется, данные это подтверждают.
      Его менеджер – сильный технарь – уже несколько раз давал ему «последний шанс» и снова просит подождать.
    options:
      - label: "Дать менеджеру еще месяц – это его команда и его решение"
        good: false
        outcome: "Месяц превращается в квартал, команда перестает жаловаться, потому что не видит смысла. Вы узнаёте о цене решения, когда уходят те, кто тянул работу за двоих."
      - label: "Уволить сотрудника самому через голову менеджера"
        good: false
        outcome: "Проблема с сотрудником решена, а проблема с решениями – нет. Менеджер потерял авторитет, следующий трудный вопрос он снова отложит, а команда усвоит, что решает не он."
      - label: "Разобрать с менеджером, чем именно это вредит бизнесу и команде, и если вред подтвержден, а решать он не готов – перевести его на IC-трек"
        good: true
        outcome: "Вы отделяете вопрос «плох ли сотрудник» от вопроса «может ли этот человек управлять». Сильный технарь остается сильным технарем, а у команды появляется руководитель, который принимает трудные решения."
    lesson: "Когда менеджер раз за разом откладывает трудное решение, проблема уже не в подчиненном, а в том, что роль менеджера никто не исполняет."
    link: "insights/week-2026-09-28"
  # --- пулреквест на 20 000 строк от агента ---
  - id: week-2026-09-28-huge-pr
    prompt: |-
      Разработчик с агентом за пару дней принес пулреквест на 20 000 строк в сервис, который трогает биллинг.
      Вы отвечаете за прод, и прочитать это построчно за разумное время невозможно.
    options:
      - label: "Отклонить и объявить правило: не больше 1 000 строк в одном PR"
        good: false
        outcome: "Утром вместо одного PR на 20 000 строк приходят двадцать по 1 000, и связи между ними видны еще хуже. Ответственность переложена на разработчика задним числом, а понимание системы не выросло."
      - label: "Сесть и вычитать все построчно – прод важнее сроков"
        good: false
        outcome: "Через неделю вы где-то на середине, глаз замылен, а рискованные места в биллинге пролистаны вместе с шаблонным кодом. Ревью стало узким местом, и KPI по time to market теперь висит на вас."
      - label: "Попросить разбить на связанные части по уровню риска и приложить артефакты: схему, требования, список проверок; биллинг читать внимательно, остальное – по артефактам"
        good: true
        outcome: "Критичная часть получает настоящее ревью, остальное проверяется через проверки и описание. Заодно у команды появляется договоренность о формате, которой не хватало до появления агентов."
    lesson: "Ревью масштабируется не правилом про количество строк, а разделением по риску и артефактами, которые позволяют не читать каждую строку там, где это не критично."
    link: "insights/week-2026-09-28"
  # --- джун вырос на два грейда, а зарплата – на инфляцию ---
  - id: week-2026-10-05-junior-band
    prompt: |-
      Ваш джун за полтора года вырос с первого грейда до третьего, а зарплата поднималась на 10–15% в год.
      На рынке на позицию третьего джуна сразу предлагают почти вдвое больше. Он пока не приходил с офером.
    options:
      - label: "Держаться политики компании – повышения раз в год на процент, как у всех"
        good: false
        outcome: "Через пару месяцев он уходит туда, где на входе платят по грейду, а вы снова нанимаете первого джуна и полтора года его учите. Грейдинг сработал как бесплатное обучение для конкурента."
      - label: "Подождать, пока принесет офер, и тогда сделать контрпредложение"
        good: false
        outcome: "Офер приходит, вы торгуетесь и догоняете рынок наполовину. Человек остается с ощущением, что ценить его начали только под угрозой ухода, а команда усваивает, что повышение получают через офер."
      - label: "Пересмотреть зарплату при переходе между грейдами по рыночной вилке грейда и заложить это в бюджет заранее"
        good: true
        outcome: "Рост грейда сразу отражается в деньгах, и уходить ради той же позиции незачем. Бюджет становится предсказуемым, а грейды – не только оценкой, но и обещанием."
    lesson: "Если грейд растет быстрее зарплаты, вы готовите сотрудника для рынка: пересматривайте деньги вместе с грейдом, а не в ответ на офер."
    link: "insights/week-2026-10-05"
  # --- модель оценки от ИИ спорит с ощущением руководителя ---
  - id: week-2026-10-12-assessment-model
    prompt: |-
      Вы собрали оценку квалификаций команды по критериям, которые сгенерировал ИИ, и свели баллы в таблицу.
      Картина по цифрам сильно расходится с тем, как вы сами видите сильные и слабые стороны людей.
    options:
      - label: "Подкрутить веса критериев, пока цифры не совпадут с вашим ощущением"
        good: false
        outcome: "Цифры совпали, но теперь модель лишь повторяет ваше мнение, включая его предвзятость. Прозрачности не прибавилось, а команда получит «объективную» оценку, которая на деле – ваша интуиция в таблице."
      - label: "Довериться цифрам – модель объективнее, чем впечатление руководителя"
        good: false
        outcome: "Вы принимаете решения о людях по критериям, которые никто не проверял и не может объяснить. Первый же спорный разговор упирается в вопрос «а почему это вообще мерили», и ответить на него нечем."
      - label: "Разобрать критерии: что каждый на самом деле меряет, на каких сотрудниках расхождение и кто прав в конкретных случаях"
        good: true
        outcome: "Часть критериев оказывается шумом, часть – вскрывает то, чего вы не замечали. Модель становится вашей, вы можете ее объяснить, а расхождения превращаются в повод для разговора, а не для подгонки."
    lesson: "Модель оценки, которую вы не можете проконтролировать, не прозрачнее интуиции: разбирайтесь с критериями, а не подгоняйте коэффициенты под ответ."
    link: "insights/week-2026-10-12"
