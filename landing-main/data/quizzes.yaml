# Еженедельные квизы «проверь себя» – по одному на каждый дайджест инсайтов.
# Переиспользуют движок симулятора (sim): та же форма вопроса, что и scenario.
#   id        – slug недели (совпадает с .File.ContentBaseName insight-страницы)
#   title     – заголовок в шапке панели
#   slug      – «папка» в строке терминала (~/quiz)
#   shareUrl  – куда ведёт «поделиться»
#   shareLabel, scoreLabel, verdicts – формулировки итога (переопределяют sim)
#   shuffle: false, limit – квиз идёт по порядку, все вопросы
#   scenarios – вопросы; форма как в data/scenarios.yaml (prompt/options/lesson/link)
#    вариант без voices – шкала «так выбрали» не показывается.

quizzes:
  - id: week-2026-06-16
    title: "Проверь себя – 16–22 июня"
    slug: quiz
    shareUrl: "https://teamleads.kz/insights/week-2026-06-16/#quiz"
    shareLabel: "Квиз недели"
    scoreLabel: "верных ответов"
    verdicts:
      - "Отлично – материал недели усвоен."
      - "Неплохо, но пару тем стоит перечитать."
      - "Стоит вернуться к дайджесту недели."
    shuffle: false
    limit: 12
    scenarios:
      - prompt: |-
          Команда просит ещё одного человека – «и всё наладится».
          По какому критерию предлагал нанимать Егор?
        options:
          - { label: "Когда сотрудник совмещает роли, в которых нет сильных компетенций", good: true, outcome: "Найм под конкретную перегруженную роль без компетенции – против боли, а не ради головы." }
          - { label: "Нанимать сразу – рук явно не хватает", good: false, outcome: "Чаще растят бюрократию и теряют, кто за что отвечает." }
          - { label: "Добавить процессы и подождать – вдруг устаканится", good: false, outcome: "Процесс поверх перегруза – лак поверх трещины." }
        lesson: "Нанимать стоит под конкретную перегруженную роль, а не чтобы «стало полегче» вообще."
        link: insights/week-2026-06-16

      - prompt: |-
          В чате 500 человек, а пишут стабильно двадцать.
          Это болезнь или норма?
        options:
          - { label: "Здоровый показатель – ядро активных самовоспроизводится, остальные читают", good: true, outcome: "Если отрезать верхний квартиль активных, он восстановится из оставшихся." }
          - { label: "Болезнь – надо срочно расшевеливать молчунов", good: false, outcome: "Требовать от каждого писать бессмысленно – читающее большинство тоже получает знания." }
          - { label: "Значит, встречи не работают", good: false, outcome: "Рост активных как раз шёл за счёт еженедельных встреч." }
        lesson: "Молчаливое чтение – норма. Аудитория, которая читает дайджесты, всё равно учится."
        link: insights/week-2026-06-16

      - prompt: |-
          Кодинг подешевел – AI пишет бойлерплейт за копейки.
          Где теперь главное узкое место, по Андрею?
        options:
          - { label: "Обучение бизнеса – оно осталось дорогим", good: true, outcome: "Медленный код давал время подумать; дорогое всегда было обучение бизнеса, а не код." }
          - { label: "Написание кода – стало ещё дороже", good: false, outcome: "Как раз кодинг Азат назвал тем, что подешевело." }
          - { label: "Инфраструктура и хостинг", good: false, outcome: "Это не всплывало как узкое место создания продукта." }
        lesson: "Подешевевший код обнажает другое узкое место – медленное и дорогое обучение бизнеса."
        link: insights/week-2026-06-16

      - prompt: |-
          Джун впервые уронил прод, руки трясутся.
          Как привить ответственность, по Артуру?
        options:
          - { label: "Дать осознать, что из-за него сломалось, и чинить самому", good: true, outcome: "Пока тимлид бегает и «подтирает», ответственность не вырастает." }
          - { label: "Подтирать за ним, пока не научится", good: false, outcome: "Так джун прибежит к вам и в следующий раз." }
          - { label: "Запретить трогать прод", good: false, outcome: "Снимаете риск – и заодно рост." }
        lesson: "Ответственность не передаётся лекцией – дайте обжечься под присмотром."
        link: insights/week-2026-06-16

      - prompt: |-
          Админ забанил участника без объяснения причины.
          Позиция Василия в этом споре?
        options:
          - { label: "Причина должна быть прозрачна – иначе путь к самодурству", good: true, outcome: "«Королева всегда права» без прозрачности превращается в произвол." }
          - { label: "Админ – садовник в своём саду, объяснять необязательно", good: false, outcome: "Это позиция Артёма – жёсткая, но не василиева." }
          - { label: "Банить можно только голосованием сообщества", good: false, outcome: "Это ближе к позиции фасилитатора, а не к аргументу Василия." }
        lesson: "Карательная история должна быть понятной – иначе никто не узнает о самодурстве."
        link: insights/week-2026-06-16

      - prompt: |-
          Сайт выглядит «как все» – ИИшно.
          Почему так, по Станиславу?
        options:
          - { label: "Из-за библиотек, которые модель тащит по умолчанию", good: true, outcome: "Лекарство – конкретные референсы на вход, а не усреднённые паттерны." }
          - { label: "Потому что ИИ принципиально не умеет в дизайн", good: false, outcome: "Дело не в «неумении», а в усреднении входных данных." }
          - { label: "Из-за шрифтов и цветов", good: false, outcome: "Первопричина – дефолтные библиотеки, а не типографика." }
        lesson: "«НеИИшность» – это дисциплина входных данных: задавайте референс явно."
        link: insights/week-2026-06-16
